openapi: 3.0.0
info:
  title: Core Payments API
  version: "1.0.0"
paths:
  /v1/payments/create:
    post:
      summary: Create a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: number
                currency:
                  type: string
      responses:
        "200":
          description: Payment created
